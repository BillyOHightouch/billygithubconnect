name: IDR - AirNZ - Bookings
source: Snowflake-aaa71
description: Bookings table
type: raw_sql
rawSql: |-
  SELECT
      /* Keys and relationships */
      TO_VARCHAR(EVENT_ID) AS booking_id,
      TO_VARCHAR(USER_ID)  AS customer_id,

      /* Air NZ-style booking reference using a numeric hash of EVENT_ID */
      CONCAT(
          'NZ',
          LPAD(
              TO_VARCHAR(
                  MOD(
                      ABS(HASH(TO_VARCHAR(EVENT_ID))),
                      1000000
                  )
              ),
              6,
              '0'
          )
      ) AS booking_reference,

      /* Booking / travel dates derived from NUMBER_1000 and NUMBER_365 */
      DATEADD('day', -NUMBER_1000, CURRENT_DATE())::DATE AS booking_date,
      DATEADD('day', -NUMBER_365, CURRENT_DATE())::DATE   AS travel_start_date,
      DATEADD('day', -NUMBER_365 + NUMBER_7, CURRENT_DATE())::DATE AS travel_end_date,

      /* Trip type and status derived from NUMBER_10 and BOOLEAN flags */
      CASE
          WHEN NUMBER_10 < 3 THEN 'One-way'
          WHEN NUMBER_10 < 7 THEN 'Return'
          ELSE 'Multi-city'
      END AS trip_type,

      CASE
          WHEN BOOLEAN_87 THEN 'Cancelled'
          WHEN BOOLEAN_52 THEN 'Completed'
          WHEN BOOLEAN_34 THEN 'Ticketed'
          ELSE 'Pending'
      END AS booking_status,

      /* Booking channel and POS country derived from NUMBER_7 */
      CASE MOD(NUMBER_7, 5)
          WHEN 0 THEN 'AirNewZealand.com'
          WHEN 1 THEN 'Mobile App'
          WHEN 2 THEN 'Travel Agent'
          WHEN 3 THEN 'Corporate Portal'
          ELSE 'Contact Centre'
      END AS booking_channel,

      CASE MOD(NUMBER_7, 5)
          WHEN 0 THEN 'NZ'
          WHEN 1 THEN 'AU'
          WHEN 2 THEN 'US'
          WHEN 3 THEN 'GB'
          ELSE 'SG'
      END AS point_of_sale_country,

      /* Synthetic commercial info derived only from NUMBER_* fields */
      ((NUMBER_100 * 10) + NUMBER_30)::NUMBER(12, 2) AS total_fare_amount_nzd,
      (NUMBER_30 * 1.5)::NUMBER(12, 2)               AS total_taxes_amount_nzd,
      (
          ((NUMBER_100 * 10) + NUMBER_30)
          + (NUMBER_30 * 1.5)
      )::NUMBER(12, 2) AS total_amount_nzd,

      CASE
          WHEN NUMBER_7 >= 0 THEN 'NZD'
      END AS currency,

      CASE MOD(NUMBER_10, 4)
          WHEN 0 THEN 'Credit Card'
          WHEN 1 THEN 'Airpoints Dollars + Pay'
          WHEN 2 THEN 'Airpoints Dollars Only'
          ELSE 'Voucher'
      END AS payment_method,

      CASE MOD(NUMBER_10, 3)
          WHEN 0 THEN 'Visa'
          WHEN 1 THEN 'Mastercard'
          ELSE 'American Express'
      END AS payment_card_type,

      CASE
          WHEN NUMBER_10 < 3 THEN 'Seat'
          WHEN NUMBER_10 < 6 THEN 'Flexitime'
          WHEN NUMBER_10 < 8 THEN 'Works'
          ELSE 'Works Deluxe'
      END AS fare_brand,

      /* Loyalty context at booking derived from NUMBER_100 and NUMBER_10 */
      CASE
          WHEN NUMBER_100 < 5 THEN 'Elite Priority One'
          WHEN NUMBER_100 < 15 THEN 'Elite'
          WHEN NUMBER_100 < 35 THEN 'Gold'
          WHEN NUMBER_100 < 65 THEN 'Silver'
          ELSE 'Koru'
      END AS loyalty_tier_at_booking,

      CASE
          WHEN MOD(NUMBER_10, 4) IN (1, 2) THEN NUMBER_1000
          ELSE 0
      END AS airpoints_dollars_used,

      CASE
          WHEN MOD(NUMBER_10, 4) IN (1, 2) THEN (NUMBER_100 * 2)::NUMBER(12, 2)
          ELSE 0::NUMBER(12, 2)
      END AS cash_component_nzd,

      /* Total ancillary revenue per booking (NZD) */
      (
          /* Checked baggage: BOOLEAN_52, quantity = (MOD(NUMBER_10, 2) + 1), price 35 each */
          CASE
              WHEN BOOLEAN_52 THEN ((MOD(NUMBER_10, 2) + 1) * 35)
              ELSE 0
          END
          +
          /* Seat selection: BOOLEAN_87, price 20 + MOD(NUMBER_30, 10) */
          CASE
              WHEN BOOLEAN_87 THEN (20 + MOD(NUMBER_30, 10))
              ELSE 0
          END
          +
          /* Travel insurance: BOOLEAN_34, price 40 + MOD(NUMBER_100, 20) */
          CASE
              WHEN BOOLEAN_34 THEN (40 + MOD(NUMBER_100, 20))
              ELSE 0
          END
          +
          /* Skycouch / meal / priority boarding from NUMBER_10 pattern */
          CASE
              WHEN MOD(NUMBER_10, 3) = 0 THEN (40 + MOD(NUMBER_30, 20))         -- Skycouch / Preferred Seat
              WHEN MOD(NUMBER_10, 3) = 1 THEN ((MOD(NUMBER_7, 2) + 1) * 18)     -- Onboard meal(s)
              WHEN MOD(NUMBER_10, 3) = 2 THEN (15 + MOD(NUMBER_30, 10))         -- Priority boarding
              ELSE 0
          END
      )::NUMBER(12,2) AS total_ancillary_revenue_nzd,

      /* Existing marketing context */
      CAMPAIGN AS marketing_campaign,
      SOURCE   AS marketing_source,

      /* Human-friendly marketing fields (keep original columns) */
      CASE MOD(SOURCE, 6)
          WHEN 0 THEN 'facebook'
          WHEN 1 THEN 'instagram'
          WHEN 2 THEN 'google_search'
          WHEN 3 THEN 'tiktok'
          WHEN 4 THEN 'email'
          ELSE 'affiliate'
      END AS actual_marketing_source,

      CASE MOD(NUMBER_7, 6)
          WHEN 0 THEN 'kids fly free sale'
          WHEN 1 THEN 'double status points'
          WHEN 2 THEN 'winter pacific islands sale'
          WHEN 3 THEN 'business premier upgrade push'
          WHEN 4 THEN 'last minute weekend escape'
          ELSE 'school holidays family sale'
      END AS actual_marketing_campaign,

      /* Array of flight leg objects derived per booking */
      ARRAY_CONSTRUCT(
          /* --------- LEG 1 --------- */
          OBJECT_CONSTRUCT(
              'leg_number', 1,

              'marketing_carrier_code',
                  CASE
                      WHEN MOD(NUMBER_7 + 1, 5) IN (0, 1, 2, 3) THEN 'NZ'
                      ELSE 'JQ'
                  END,

              'operating_carrier_code',
                  CASE
                      WHEN MOD(NUMBER_7 + 1, 7) < 5 THEN 'NZ'
                      ELSE 'UA'
                  END,

              'flight_number',
                  LPAD(
                      TO_VARCHAR(100 + MOD(NUMBER_100 + 3, 900)),
                      4,
                      '0'
                  ),

              'departure_airport_code',
                  CASE MOD(NUMBER_7 + 1, 8)
                      WHEN 0 THEN 'AKL'
                      WHEN 1 THEN 'WLG'
                      WHEN 2 THEN 'CHC'
                      WHEN 3 THEN 'ZQN'
                      WHEN 4 THEN 'DUD'
                      WHEN 5 THEN 'SYD'
                      WHEN 6 THEN 'LAX'
                      ELSE 'NRT'
                  END,

              'arrival_airport_code',
                  CASE MOD(NUMBER_7 + 1 + 3, 8)
                      WHEN 0 THEN 'AKL'
                      WHEN 1 THEN 'WLG'
                      WHEN 2 THEN 'CHC'
                      WHEN 3 THEN 'ZQN'
                      WHEN 4 THEN 'DUD'
                      WHEN 5 THEN 'SYD'
                      WHEN 6 THEN 'LAX'
                      ELSE 'NRT'
                  END,

              'departure_country_code',
                  CASE MOD(NUMBER_7 + 1, 8)
                      WHEN 0 THEN 'NZ'
                      WHEN 1 THEN 'NZ'
                      WHEN 2 THEN 'NZ'
                      WHEN 3 THEN 'NZ'
                      WHEN 4 THEN 'NZ'
                      WHEN 5 THEN 'AU'
                      WHEN 6 THEN 'US'
                      ELSE 'JP'
                  END,

              'arrival_country_code',
                  CASE MOD(NUMBER_7 + 1 + 3, 8)
                      WHEN 0 THEN 'NZ'
                      WHEN 1 THEN 'NZ'
                      WHEN 2 THEN 'NZ'
                      WHEN 3 THEN 'NZ'
                      WHEN 4 THEN 'NZ'
                      WHEN 5 THEN 'AU'
                      WHEN 6 THEN 'US'
                      ELSE 'JP'
                  END,

              'route_type',
                  CASE
                      WHEN
                          CASE MOD(NUMBER_7 + 1, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      AND
                          CASE MOD(NUMBER_7 + 1 + 3, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      THEN 'Domestic'
                      ELSE 'International'
                  END,

              'departure_scheduled_local',
                  DATEADD(
                      'day',
                      -NUMBER_365 + 1,
                      CURRENT_DATE()
                  )::TIMESTAMP_NTZ,

              'arrival_scheduled_local',
                  DATEADD(
                      'hour',
                      2 + MOD(NUMBER_30, 6),
                      DATEADD(
                          'day',
                          -NUMBER_365 + 1,
                          CURRENT_DATE()
                      )::TIMESTAMP_NTZ
                  ),

              'cabin_class',
                  CASE
                      WHEN NUMBER_10 < 3 THEN 'Economy'
                      WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                      WHEN NUMBER_10 < 8 THEN 'Business Premier'
                      ELSE 'Economy Skycouch'
                  END,

              'airpoints_dollars_earned',
                  CASE
                      WHEN
                          CASE MOD(NUMBER_7 + 1, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      AND
                          CASE MOD(NUMBER_7 + 1 + 3, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      THEN 5 + MOD(NUMBER_30, 10)
                      ELSE 25 + MOD(NUMBER_30, 50)
                  END,

              'status_points_earned',
                  CASE
                      WHEN
                          CASE
                              WHEN NUMBER_10 < 3 THEN 'Economy'
                              WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                              WHEN NUMBER_10 < 8 THEN 'Business Premier'
                              ELSE 'Economy Skycouch'
                          END = 'Business Premier' THEN 90
                      WHEN
                          CASE
                              WHEN NUMBER_10 < 3 THEN 'Economy'
                              WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                              WHEN NUMBER_10 < 8 THEN 'Business Premier'
                              ELSE 'Economy Skycouch'
                          END = 'Premium Economy' THEN 60
                      WHEN
                          CASE
                              WHEN NUMBER_10 < 3 THEN 'Economy'
                              WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                              WHEN NUMBER_10 < 8 THEN 'Business Premier'
                              ELSE 'Economy Skycouch'
                          END = 'Economy Skycouch' THEN 45
                      ELSE 30
                  END,

              'distance_miles',
                  500 + NUMBER_30 * 20,

              'star_alliance_partner_flight',
                  CASE
                      WHEN MOD(NUMBER_7 + 1, 5) IN (0, 1, 2, 3)
                       AND MOD(NUMBER_7 + 1, 7) >= 5
                      THEN TRUE
                      ELSE FALSE
                  END
          ),

          /* --------- LEG 2 --------- */
          OBJECT_CONSTRUCT(
              'leg_number', 2,

              'marketing_carrier_code',
                  CASE
                      WHEN MOD(NUMBER_7 + 2, 5) IN (0, 1, 2, 3) THEN 'NZ'
                      ELSE 'JQ'
                  END,

              'operating_carrier_code',
                  CASE
                      WHEN MOD(NUMBER_7 + 2, 7) < 5 THEN 'NZ'
                      ELSE 'UA'
                  END,

              'flight_number',
                  LPAD(
                      TO_VARCHAR(100 + MOD(NUMBER_100 + 6, 900)),
                      4,
                      '0'
                  ),

              'departure_airport_code',
                  CASE MOD(NUMBER_7 + 2, 8)
                      WHEN 0 THEN 'AKL'
                      WHEN 1 THEN 'WLG'
                      WHEN 2 THEN 'CHC'
                      WHEN 3 THEN 'ZQN'
                      WHEN 4 THEN 'DUD'
                      WHEN 5 THEN 'SYD'
                      WHEN 6 THEN 'LAX'
                      ELSE 'NRT'
                  END,

              'arrival_airport_code',
                  CASE MOD(NUMBER_7 + 2 + 3, 8)
                      WHEN 0 THEN 'AKL'
                      WHEN 1 THEN 'WLG'
                      WHEN 2 THEN 'CHC'
                      WHEN 3 THEN 'ZQN'
                      WHEN 4 THEN 'DUD'
                      WHEN 5 THEN 'SYD'
                      WHEN 6 THEN 'LAX'
                      ELSE 'NRT'
                  END,

              'departure_country_code',
                  CASE MOD(NUMBER_7 + 2, 8)
                      WHEN 0 THEN 'NZ'
                      WHEN 1 THEN 'NZ'
                      WHEN 2 THEN 'NZ'
                      WHEN 3 THEN 'NZ'
                      WHEN 4 THEN 'NZ'
                      WHEN 5 THEN 'AU'
                      WHEN 6 THEN 'US'
                      ELSE 'JP'
                  END,

              'arrival_country_code',
                  CASE MOD(NUMBER_7 + 2 + 3, 8)
                      WHEN 0 THEN 'NZ'
                      WHEN 1 THEN 'NZ'
                      WHEN 2 THEN 'NZ'
                      WHEN 3 THEN 'NZ'
                      WHEN 4 THEN 'NZ'
                      WHEN 5 THEN 'AU'
                      WHEN 6 THEN 'US'
                      ELSE 'JP'
                  END,

              'route_type',
                  CASE
                      WHEN
                          CASE MOD(NUMBER_7 + 2, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      AND
                          CASE MOD(NUMBER_7 + 2 + 3, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      THEN 'Domestic'
                      ELSE 'International'
                  END,

              'departure_scheduled_local',
                  DATEADD(
                      'day',
                      -NUMBER_365 + 2,
                      CURRENT_DATE()
                  )::TIMESTAMP_NTZ,

              'arrival_scheduled_local',
                  DATEADD(
                      'hour',
                      2 + MOD(NUMBER_30 + 2, 6),
                      DATEADD(
                          'day',
                          -NUMBER_365 + 2,
                          CURRENT_DATE()
                      )::TIMESTAMP_NTZ
                  ),

              'cabin_class',
                  CASE
                      WHEN NUMBER_10 < 3 THEN 'Economy'
                      WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                      WHEN NUMBER_10 < 8 THEN 'Business Premier'
                      ELSE 'Economy Skycouch'
                  END,

              'airpoints_dollars_earned',
                  CASE
                      WHEN
                          CASE MOD(NUMBER_7 + 2, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      AND
                          CASE MOD(NUMBER_7 + 2 + 3, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      THEN 5 + MOD(NUMBER_30, 10)
                      ELSE 25 + MOD(NUMBER_30, 50)
                  END,

              'status_points_earned',
                  CASE
                      WHEN
                          CASE
                              WHEN NUMBER_10 < 3 THEN 'Economy'
                              WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                              WHEN NUMBER_10 < 8 THEN 'Business Premier'
                              ELSE 'Economy Skycouch'
                          END = 'Business Premier' THEN 90
                      WHEN
                          CASE
                              WHEN NUMBER_10 < 3 THEN 'Economy'
                              WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                              WHEN NUMBER_10 < 8 THEN 'Business Premier'
                              ELSE 'Economy Skycouch'
                          END = 'Premium Economy' THEN 60
                      WHEN
                          CASE
                              WHEN NUMBER_10 < 3 THEN 'Economy'
                              WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                              WHEN NUMBER_10 < 8 THEN 'Business Premier'
                              ELSE 'Economy Skycouch'
                          END = 'Economy Skycouch' THEN 45
                      ELSE 30
                  END,

              'distance_miles',
                  500 + NUMBER_30 * 20,

              'star_alliance_partner_flight',
                  CASE
                      WHEN MOD(NUMBER_7 + 2, 5) IN (0, 1, 2, 3)
                       AND MOD(NUMBER_7 + 2, 7) >= 5
                      THEN TRUE
                      ELSE FALSE
                  END
          ),

          /* --------- LEG 3 --------- */
          OBJECT_CONSTRUCT(
              'leg_number', 3,

              'marketing_carrier_code',
                  CASE
                      WHEN MOD(NUMBER_7 + 3, 5) IN (0, 1, 2, 3) THEN 'NZ'
                      ELSE 'JQ'
                  END,

              'operating_carrier_code',
                  CASE
                      WHEN MOD(NUMBER_7 + 3, 7) < 5 THEN 'NZ'
                      ELSE 'UA'
                  END,

              'flight_number',
                  LPAD(
                      TO_VARCHAR(100 + MOD(NUMBER_100 + 9, 900)),
                      4,
                      '0'
                  ),

              'departure_airport_code',
                  CASE MOD(NUMBER_7 + 3, 8)
                      WHEN 0 THEN 'AKL'
                      WHEN 1 THEN 'WLG'
                      WHEN 2 THEN 'CHC'
                      WHEN 3 THEN 'ZQN'
                      WHEN 4 THEN 'DUD'
                      WHEN 5 THEN 'SYD'
                      WHEN 6 THEN 'LAX'
                      ELSE 'NRT'
                  END,

              'arrival_airport_code',
                  CASE MOD(NUMBER_7 + 3 + 3, 8)
                      WHEN 0 THEN 'AKL'
                      WHEN 1 THEN 'WLG'
                      WHEN 2 THEN 'CHC'
                      WHEN 3 THEN 'ZQN'
                      WHEN 4 THEN 'DUD'
                      WHEN 5 THEN 'SYD'
                      WHEN 6 THEN 'LAX'
                      ELSE 'NRT'
                  END,

              'departure_country_code',
                  CASE MOD(NUMBER_7 + 3, 8)
                      WHEN 0 THEN 'NZ'
                      WHEN 1 THEN 'NZ'
                      WHEN 2 THEN 'NZ'
                      WHEN 3 THEN 'NZ'
                      WHEN 4 THEN 'NZ'
                      WHEN 5 THEN 'AU'
                      WHEN 6 THEN 'US'
                      ELSE 'JP'
                  END,

              'arrival_country_code',
                  CASE MOD(NUMBER_7 + 3 + 3, 8)
                      WHEN 0 THEN 'NZ'
                      WHEN 1 THEN 'NZ'
                      WHEN 2 THEN 'NZ'
                      WHEN 3 THEN 'NZ'
                      WHEN 4 THEN 'NZ'
                      WHEN 5 THEN 'AU'
                      WHEN 6 THEN 'US'
                      ELSE 'JP'
                  END,

              'route_type',
                  CASE
                      WHEN
                          CASE MOD(NUMBER_7 + 3, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      AND
                          CASE MOD(NUMBER_7 + 3 + 3, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      THEN 'Domestic'
                      ELSE 'International'
                  END,

              'departure_scheduled_local',
                  DATEADD(
                      'day',
                      -NUMBER_365 + 3,
                      CURRENT_DATE()
                  )::TIMESTAMP_NTZ,

              'arrival_scheduled_local',
                  DATEADD(
                      'hour',
                      2 + MOD(NUMBER_30 + 4, 6),
                      DATEADD(
                          'day',
                          -NUMBER_365 + 3,
                          CURRENT_DATE()
                      )::TIMESTAMP_NTZ
                  ),

              'cabin_class',
                  CASE
                      WHEN NUMBER_10 < 3 THEN 'Economy'
                      WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                      WHEN NUMBER_10 < 8 THEN 'Business Premier'
                      ELSE 'Economy Skycouch'
                  END,

              'airpoints_dollars_earned',
                  CASE
                      WHEN
                          CASE MOD(NUMBER_7 + 3, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      AND
                          CASE MOD(NUMBER_7 + 3 + 3, 8)
                              WHEN 0 THEN 'NZ'
                              WHEN 1 THEN 'NZ'
                              WHEN 2 THEN 'NZ'
                              WHEN 3 THEN 'NZ'
                              WHEN 4 THEN 'NZ'
                              WHEN 5 THEN 'AU'
                              WHEN 6 THEN 'US'
                              ELSE 'JP'
                          END = 'NZ'
                      THEN 5 + MOD(NUMBER_30, 10)
                      ELSE 25 + MOD(NUMBER_30, 50)
                  END,

              'status_points_earned',
                  CASE
                      WHEN
                          CASE
                              WHEN NUMBER_10 < 3 THEN 'Economy'
                              WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                              WHEN NUMBER_10 < 8 THEN 'Business Premier'
                              ELSE 'Economy Skycouch'
                          END = 'Business Premier' THEN 90
                      WHEN
                          CASE
                              WHEN NUMBER_10 < 3 THEN 'Economy'
                              WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                              WHEN NUMBER_10 < 8 THEN 'Business Premier'
                              ELSE 'Economy Skycouch'
                          END = 'Premium Economy' THEN 60
                      WHEN
                          CASE
                              WHEN NUMBER_10 < 3 THEN 'Economy'
                              WHEN NUMBER_10 < 6 THEN 'Premium Economy'
                              WHEN NUMBER_10 < 8 THEN 'Business Premier'
                              ELSE 'Economy Skycouch'
                          END = 'Economy Skycouch' THEN 45
                      ELSE 30
                  END,

              'distance_miles',
                  500 + NUMBER_30 * 20,

              'star_alliance_partner_flight',
                  CASE
                      WHEN MOD(NUMBER_7 + 3, 5) IN (0, 1, 2, 3)
                       AND MOD(NUMBER_7 + 3, 7) >= 5
                      THEN TRUE
                      ELSE FALSE
                  END
          )
      ) AS flight_legs

  FROM public.events;
primaryKey: BOOKING_ID
