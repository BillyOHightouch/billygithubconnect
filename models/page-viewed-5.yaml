name: PAGE VIEWED
source: Snowflake-cd6b9
type: raw_sql
rawSql: |-
  SELECT
    CONCAT('EVT-PAGE-', e.EVENT_ID)                            AS page_viewed_event_id,
    e.USER_ID                                                  AS member_id,
    'Page Viewed'                                              AS event_name,
    'page_viewed'                                              AS event_type,

    /* When the page was viewed */
    DATEADD('day', -e.NUMBER_365, CURRENT_TIMESTAMP())         AS created_at,

    /* Channel aligned to Linkt experience (app vs website) */
    CASE
      WHEN e.SOURCE % 3 = 0 THEN 'Linkt app - Rewards tab'
      WHEN e.SOURCE % 3 = 1 THEN 'Linkt website'
      ELSE 'Linkt app - Account Home'
    END                                                        AS page_channel,

    /* Page category using Linkt language */
    CASE
      WHEN e.NUMBER_10 % 5 = 0 THEN 'Linkt Rewards offers'
      WHEN e.NUMBER_10 % 5 = 1 THEN 'Accounts and passes'
      WHEN e.NUMBER_10 % 5 = 2 THEN 'Toll calculator'
      WHEN e.NUMBER_10 % 5 = 3 THEN 'Trip Compare'
      ELSE 'Help and FAQs'
    END                                                        AS page_category,

    /* City context for toll road usage */
    CASE
      WHEN e.NUMBER_100 % 3 = 0 THEN 'Sydney'
      WHEN e.NUMBER_100 % 3 = 1 THEN 'Melbourne'
      ELSE 'Brisbane'
    END                                                        AS primary_city,

    /* Engagement signal for early tenure and at-risk behaviour */
    CASE
      WHEN e.BOOLEAN_34 THEN 'Viewed Linkt Rewards details'
      WHEN e.BOOLEAN_52 THEN 'Viewed account and billing page'
      WHEN e.BOOLEAN_87 THEN 'Viewed payment/help while account in arrears'
      ELSE 'Standard browsing session'
    END                                                        AS page_engagement_context
  FROM public.events e;
primaryKey: PAGE_VIEWED_EVENT_ID
