                   WHEN BOOLEAN_52 THEN 'Lapsed'
                   WHEN BOOLEAN_87 THEN 'Suspended'
                   ELSE 'Pending Activation'
               END = 'Lapsed' THEN 'Churned'
          WHEN (NUMBER_100 * 1000) >= 70000 THEN 'High Value Engaged'
          WHEN (NUMBER_100 * 1000) >= 30000 THEN 'Mid Value Engaged'
          ELSE 'Low Engagement'
      END AS LOYALTY_ENGAGEMENT_SEGMENT

  FROM public.users

