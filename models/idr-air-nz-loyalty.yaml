          WHEN BOOLEAN_87 THEN 'Koru'
          ELSE 'None'
      END AS lounge_access,

      CASE
          WHEN NUMBER_10 < 3 THEN 'Yes'
          ELSE 'No'
      END AS star_alliance_benefits_included,

      CASE
          WHEN BOOLEAN_52 THEN 'Yes'
          ELSE 'No'
      END AS family_pooling_eligible,

      CASE
          WHEN BOOLEAN_34 THEN 'Yes'
          ELSE 'No'
      END AS marketing_opt_in_for_airpoints,

      DATEADD('day', -1 * NUMBER_7, CURRENT_DATE()) AS last_activity_date,

      CASE
          WHEN CASE
                   WHEN BOOLEAN_34 THEN 'Active'
                   WHEN BOOLEAN_52 THEN 'Lapsed'
                   WHEN BOOLEAN_87 THEN 'Suspended'
                   ELSE 'Pending Activation'
               END = 'Suspended' THEN 'At Risk'
          WHEN CASE
